name: Diag appconfig oidc
on:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Sign in as the pipeline identity and read App Configuration
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal -u "$CLIENT_ID" --tenant "$TENANT_ID" --federated-token "$tok" --allow-no-subscriptions -o none
          echo "signed in"
          az appconfig kv list --endpoint https://appcs-alz-dev-l9pk.azconfig.io --auth-mode login --label dev --query "[].key" -o tsv || true
          at=$(az account get-access-token --resource https://azconfig.io --query accessToken -o tsv)
          echo "$at" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{aud, oid, appid, idtyp}' || true
          code=$(curl -sS -o body.txt -w "%{http_code}" -H "Authorization: Bearer $at" "https://appcs-alz-dev-l9pk.azconfig.io/kv?label=dev&api-version=2023-10-01")
          echo "direct GET kv: $code"
          head -c 200 body.txt; echo
          for res in https://appcs-alz-dev-l9pk.azconfig.io https://appcs-alz-dev-l9pk.azconfig.io/ https://azconfig.io/; do
            t=$(az account get-access-token --resource "$res" --query accessToken -o tsv)
            aud=$(echo "$t" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .aud)
            c=$(curl -sS -o b2.txt -w "%{http_code}" -H "Authorization: Bearer $t" "https://appcs-alz-dev-l9pk.azconfig.io/kv/landingzone:foundry:models?label=dev&api-version=2023-10-01")
            echo "resource=$res aud=$aud GET key: $c $(head -c 150 b2.txt)"
          done
