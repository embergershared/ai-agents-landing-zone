# Lint and test on GitHub-hosted runners. Terraform checks run when a *.tf is tracked; each
# folder with one (outside modules/ and tests/) is a root module.
# "CI result" always reports and fails when any job failed: make it the one required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress; runs on main are never
# cancelled, so each main commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # A release at least 7 days old (package age gate); Dependabot doesn't bump it.
  TERRAFORM_VERSION: 1.16.6
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.stacks.outputs.terraform }}
      terraform-roots: ${{ steps.stacks.outputs.terraform-roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: stacks
        run: |
          # Terraform root modules: the folders with a tracked *.tf, except shared modules
          # (under a modules/ folder) and test helpers (under a tests/ folder).
          roots=$(git ls-files -- '*.tf' | xargs -r -n1 dirname | sort -u \
            | { grep -Ev '(^|/)(modules|tests)(/|$)' || true; } | paste -sd ' ' -)
          echo "terraform=$([ -n "$roots" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "terraform-roots=$roots" >> "$GITHUB_OUTPUT"

          {
            echo "| Stack | Detected from |"
            echo "|---|---|"
            echo "| Terraform | ${roots:-not detected} |"
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (and shellcheck on run scripts)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  terraform:
    name: Terraform checks
    needs: detect
    if: needs.detect.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOTS: ${{ needs.detect.outputs.terraform-roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format (every *.tf and *.tftest.hcl in the repository)
        run: terraform fmt -check -recursive -diff

      # No Azure sign-in here: init skips the backend, and terraform test runs against mocked
      # providers (mock_provider). Runs after a format failure too; every root module runs and
      # reports, even after another failed.
      - name: Init, validate and test each root module
        if: ${{ !cancelled() }}
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          failed=""
          echo "| Root module | Init | Validate | Test |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for root in $ROOTS; do
            echo "::group::$root"
            init=fail; validate=skipped; tests=skipped
            # -lockfile=readonly: the committed .terraform.lock.hcl must cover every provider.
            if terraform -chdir="$root" init -backend=false -lockfile=readonly; then
              init=ok
              if terraform -chdir="$root" validate; then validate=ok; else validate=fail; fi
              if ! find "$root" -name '*.tftest.hcl' -print -quit | grep -q .; then
                echo "::warning::$root has no terraform test files (*.tftest.hcl)"
                tests="no tests"
              elif terraform -chdir="$root" test; then
                tests=ok
              else
                tests=fail
              fi
            fi
            echo "::endgroup::"
            echo "| \`$root\` | $init | $validate | $tests |" >> "$GITHUB_STEP_SUMMARY"
            case "$init $validate $tests" in
              *fail*) echo "::error::Terraform checks failed in $root"; failed="$failed $root" ;;
            esac
          done
          [ -z "$failed" ]

  result:
    name: CI result
    if: always()
    needs: [detect, workflows, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled: $failed"
            exit 1
          fi
