# Plans the landing zone for each environment on every PR that changes it, and plans or applies
# one environment on demand from main. Azure sign-in through OIDC (workload identity
# federation) with the pipeline identity of src/state-backend: no client secret exists.
# Off until the repository variable TF_DEPLOY_ENABLED is "true" (docs/ci-cd.md, "Deploys").
name: Terraform deploy

on:
  pull_request:
    paths:
      - "src/landing-zone/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev]
        required: true
      action:
        description: plan only, or plan and apply
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

# Never cancel a run that may be applying: a cancelled apply leaves a locked, half-changed state.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # A release at least 7 days old (package age gate); same as ci.yml.
  TERRAFORM_VERSION: 1.16.6
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # The pipeline identity has rights on the environments' resource groups only, not on the
  # subscription's resource providers (registered once by the owner).
  ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

jobs:
  disabled:
    name: Deploy is off
    if: vars.TF_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say why nothing runs
        run: |
          echo "::notice::TF_DEPLOY_ENABLED is not 'true', so nothing is planned or applied (docs/ci-cd.md, Deploys)."

  plan:
    name: Plan (${{ matrix.environment }})
    if: vars.TF_DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      TF_VAR_project_user_principals: ${{ vars[format('PROJECT_USER_PRINCIPALS_{0}', matrix.environment)] || '{}' }}
    defaults:
      run:
        working-directory: src/landing-zone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Init (state in tfstate-${{ matrix.environment }})
        run: |
          terraform init -lockfile=readonly \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate-$ENVIRONMENT" \
            -backend-config="key=landing-zone.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Plan
        run: terraform plan -lock-timeout=5m -var-file="environments/$ENVIRONMENT.tfvars" -out=tfplan

      - name: Plan in the job summary
        run: |
          {
            echo "### Terraform plan: $ENVIRONMENT"
            echo '<details><summary>Plan</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    if: vars.TF_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The GitHub environment limits deployments to main. Its required reviewers need a paid plan
    # for a private repository; until then, the approval is starting this workflow by hand.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      TF_VAR_project_user_principals: ${{ vars[format('PROJECT_USER_PRINCIPALS_{0}', inputs.environment)] || '{}' }}
    defaults:
      run:
        working-directory: src/landing-zone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Init (state in tfstate-${{ inputs.environment }})
        run: |
          terraform init -lockfile=readonly \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate-$ENVIRONMENT" \
            -backend-config="key=landing-zone.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Plan
        run: terraform plan -lock-timeout=5m -var-file="environments/$ENVIRONMENT.tfvars" -out=tfplan

      - name: Plan in the job summary
        run: |
          {
            echo "### Terraform plan: $ENVIRONMENT ($ACTION)"
            echo '<details><summary>Plan</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the plan above
        if: inputs.action == 'apply'
        run: terraform apply -lock-timeout=5m tfplan
